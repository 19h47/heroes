<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HEROES — Adventure Characters</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="bar top">
      <h1><span class="badge">HEROES</span> Adventure Characters</h1>
      <p id="status" aria-live="polite"></p>
    </header>

    <main>
      <pre
        id="screen"
        class="screen"
        aria-live="polite"
        title="Any key: new character"
      ></pre>
      <section id="sheet" hidden></section>
    </main>
    <pre id="printout" class="printout" aria-hidden="true"></pre>

    <nav class="bar bottom" aria-label="Commands">
      <button type="button" data-key=" ">
        <kbd>Any Key</kbd> New Character
      </button>
      <button type="button" data-key="P"><kbd>P</kbd> Output</button>
      <button type="button" data-key="C"><kbd>C</kbd> Control Panel</button>
      <button type="button" data-key="~"><kbd>~</kbd> Burst</button>
      <button type="button" data-key="Escape"><kbd>Esc</kbd> Exit</button>
      <span><kbd>Alt+1/2/3</kbd> colours, <kbd>Alt+0</kbd> reset</span>
      <button type="button" data-action="sheet" aria-pressed="false">
        Full sheet
      </button>
      <button type="button" data-action="hro">.HRO</button>
      <button type="button" data-action="html">HTML</button>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/original.js"></script>
    <script src="js/traits.js"></script>
    <script src="js/rng.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/render.js"></script>
    <script src="js/screen.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
